<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d6e4f" />
    <meta name="description" content="Waleed Poultry Solutions — Pakistan's trusted online store for poultry medicines, vaccines, and supplements." />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Mulish:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <title>Waleed Poultry Solutions | Poultry Medicines & Vaccines Pakistan</title>
    <style>
      #initial-loader {
        position: fixed; inset: 0;
        background: #0d6e4f;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        z-index: 9999; transition: opacity 0.4s ease;
      }
      #initial-loader h1 { font-family: 'Playfair Display', serif; color: white; font-size: 2rem; margin-bottom: 8px; }
      #initial-loader h1 span { color: #f5a623; }
      #initial-loader p { color: rgba(255,255,255,0.7); font-family: sans-serif; font-size: 0.9rem; }
      .loader-dot { display: inline-block; width: 8px; height: 8px; background: #f5a623; border-radius: 50%; margin: 20px 4px 0; animation: bounce 1.2s infinite ease-in-out; }
      .loader-dot:nth-child(2) { animation-delay: 0.2s; }
      .loader-dot:nth-child(3) { animation-delay: 0.4s; }
      @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run Waleed Poultry Solutions.</noscript>
    <div id="initial-loader">
      <h1>🐔 Waleed<span>Poultry Solutions</span></h1>
      <p>Pakistan's Premium Poultry Health Store</p>
      <div>
        <span class="loader-dot"></span>
        <span class="loader-dot"></span>
        <span class="loader-dot"></span>
      </div>
    </div>
    <div id="root"></div>
    <script>
      window.addEventListener('load', function () {
        setTimeout(function () {
          var loader = document.getElementById('initial-loader');
          if (loader) { loader.style.opacity = '0'; setTimeout(function () { loader.style.display = 'none'; }, 400); }
        }, 500);
      });
    </script>
  </body>
</html>
